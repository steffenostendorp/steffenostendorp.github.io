title: "Steffen Ostendorp"
author: "Steffen Ostendorp"
description: "My blog"
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %d, %Y"

# Layout
show_social: true
show_excerpts: true             # show article excerpts instead of archive list on the home page
show_frame: true                # display a grey frame on large screens
show_sidebar: false             # show a sidebar instead of the usual header
show_minimal: false             # remove all clutter

#show_frame: "/assets/images/background.svg"

# Menu                          # for available icons see https://fontawesome.com/v5/icons/

navigation:                     # accepts {file, title, url, icon, sidebaricon}
  - {file: "archive.html", title: Home Change, sidebaricon: home}
  - {file: "README.md", title: About me, sidebaricon: address-card}

external:                       # accepts {file, title, url, icon, sidebaricon}
  - {title: Mail, icon: envelope, url: "mailto:author@example.com"}
  - {title: Github, icon: github, url: "https://github.com/steffenostendorp"}
  - {title: X, icon: X, url: "https://x.com/serthrgluphefen"}
  - {title: LinkedIn, icon: https://i.sstatic.net/gVE0j.png, url: "https://www.linkedin.com/in/steffen-ostendorp-44329aa3/"}
   

comments:
#  disqus_shortname: ""         # see https://disqus.com
#  isso_domain: ""              # see https://isso-comments.de

plugins:
 - jekyll-feed
